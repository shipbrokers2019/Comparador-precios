<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador de Precios de Repuestos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Comparador de Precios</h1>
        <span class="status-pill" id="sync-status-pill"><span class="status-dot"></span><span id="sync-status">Sin sincronizar</span></span>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-sync">Sincronizar</button>
    </header>

    <main id="page-comparar" class="page">
      <section class="card">
        <h2>Conexión</h2>
        <div class="field-row">
          <input class="field" type="text" id="input-webapp-url" placeholder="URL de Apps Script (/exec)">
          <button class="btn btn-secondary" id="btn-guardar-url">Guardar URL</button>
        </div>
      </section>

      <section class="card" id="panel-tasas"></section>
      <section class="card" id="panel-proveedores"></section>

      <section class="card" id="panel-busqueda">
        <h2>Buscar y comparar</h2>
        <div class="search-bar">
          <input class="field" type="text" id="filtro-texto" placeholder="Buscar por repuesto o código...">
          <select class="field" id="filtro-marca"><option value="">Todas las marcas</option></select>
        </div>
        <div class="toggle-row">
          <label class="checkbox-field"><input type="checkbox" id="chk-efectivo"> Descuento efectivo</label>
          <label class="checkbox-field"><input type="checkbox" id="chk-pronto-pago"> Pronto pago</label>
        </div>
      </section>

      <section id="panel-resultados">
        <div class="notice" id="aviso-tasas-faltantes"></div>
        <div class="table-scroll">
          <table id="tabla-resultados">
            <thead>
              <tr>
                <th>Proveedor</th><th>Repuesto</th><th>Código</th><th>Equivalencia</th><th>Marca repuesto</th>
                <th>Precio orig.</th><th>Descuentos</th><th>Tasa</th>
                <th>Precio final</th><th>Precio final (Bs)</th><th>Mínimo</th>
              </tr>
            </thead>
            <tbody id="tbody-resultados"></tbody>
          </table>
        </div>
      </section>
    </main>

    <main id="page-reportes" class="page" hidden>
      <section class="card report-card">
        <h1 class="report-title">Repuestos comparados</h1>
        <p class="report-filtro" id="reporte-filtro"></p>
        <div class="report-list" id="reporte-lista"></div>
        <div class="table-footer">
          <button class="btn btn-secondary" id="btn-exportar">Exportar a Excel</button>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" class="nav-btn is-active" id="nav-comparar" data-page="page-comparar">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-3-3z"/>
      </svg>
      <span>Comparar</span>
    </button>
    <button type="button" class="nav-btn" id="nav-reportes" data-page="page-reportes">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Reportes</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>window.App = {};</script>
  <script src="js/storage.js"></script>
  <script src="js/dictionaries.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/rates.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/search.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

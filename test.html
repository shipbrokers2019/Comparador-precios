<script>
// I1 fix: this page shares the same file:// localStorage origin as index.html.
// Snapshot any real 'cp_' prefixed data before the test suite runs, clear it
// so tests start from a clean slate, and restore it on unload so index.html
// keeps seeing real synced data instead of test fixtures after navigating away.
(function () {
  var snapshot = {};
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.indexOf('cp_') === 0) snapshot[key] = localStorage.getItem(key);
  }
  Object.keys(snapshot).forEach(function (key) { localStorage.removeItem(key); });

  window.addEventListener('beforeunload', function () {
    Object.keys(snapshot).forEach(function (key) {
      localStorage.removeItem(key);
    });
    // Remove any test-written cp_ keys not present in the original snapshot.
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key.indexOf('cp_') === 0) localStorage.removeItem(key);
    }
    Object.keys(snapshot).forEach(function (key) {
      localStorage.setItem(key, snapshot[key]);
    });
  });
})();
</script>

<script>
window.assertions = [];
function assertEqual(actual, expected, label) {
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  window.assertions.push({ label, pass, actual, expected });
}
function renderAssertions() {
  const ul = document.getElementById('test-results');
  let failCount = 0;
  window.assertions.forEach(a => {
    const li = document.createElement('li');
    li.textContent = (a.pass ? 'PASS ' : 'FAIL ') + a.label +
      (a.pass ? '' : ` (esperado ${JSON.stringify(a.expected)}, obtuvo ${JSON.stringify(a.actual)})`);
    li.style.color = a.pass ? 'green' : 'red';
    ul.appendChild(li);
    if (!a.pass) failCount++;
  });
  const summary = document.createElement('li');
  summary.textContent = `${window.assertions.length - failCount}/${window.assertions.length} pruebas OK`;
  summary.style.fontWeight = 'bold';
  ul.prepend(summary);
}
</script>

<script>
App.dictionaries.addSynonym('marca', 'CHE', 'CHEVROLET');
App.dictionaries.addSynonym('marca', 'CHEV', 'CHEVROLET');
assertEqual(
  App.dictionaries.normalizeTerm('che', App.dictionaries.getAll().marca),
  { value: 'CHEVROLET', matched: true },
  'normalizeTerm matches case-insensitive exact alias'
);
assertEqual(
  App.dictionaries.normalizeTerm('LADA', App.dictionaries.getAll().marca),
  { value: 'LADA', matched: false },
  'normalizeTerm returns original + matched:false when no alias found'
);
const item = App.dictionaries.normalizeItem({ proveedor: 'ACME', marca: 'CHE', repuesto: 'RADIADOR', precio: 10 });
assertEqual(item.marca, 'CHEVROLET', 'normalizeItem normalizes marca');
assertEqual(item.marcaNormalizada, true, 'normalizeItem flags marca as normalized');
assertEqual(item.repuestoNormalizado, false, 'normalizeItem flags unmatched repuesto');

// Fallback: extract vehicle brand from the repuesto text when the marca
// column holds an unrecognized parts-line brand instead of a vehicle brand.
const itemExtraido = App.dictionaries.normalizeItem({ proveedor: 'EBITEN', marca: 'EBITEN-BECO', repuesto: 'ANILLOS DODGE NEON MOTOR 2.0', precio: 10 });
assertEqual(itemExtraido.marca, 'DODGE', 'normalizeItem extracts vehicle brand from repuesto text when marca column does not match');
assertEqual(itemExtraido.marcaNormalizada, true, 'normalizeItem flags the extracted marca as normalized');

// A marca column that already matches (e.g. a real "VEHÍCULO" column) must
// win over any brand word that might also appear in the repuesto text.
const itemConMarcaReal = App.dictionaries.normalizeItem({ proveedor: 'LP', marca: 'FORD', repuesto: 'ANILLO GRANT CROMADO JEEP GRAND CHEROKEE', precio: 10 });
assertEqual(itemConMarcaReal.marca, 'FORD', 'normalizeItem keeps a matched marca column instead of extracting from text');

// Second fallback: no brand word in the text, but a known model name is.
const itemPorModelo = App.dictionaries.normalizeItem({ proveedor: 'EBITEN', marca: 'EBITEN-BECO', repuesto: 'CORREA UNICA SILVERADO K060950', precio: 10 });
assertEqual(itemPorModelo.marca, 'CHEVROLET', 'normalizeItem extracts vehicle brand from a model name (SILVERADO) when no brand word is present');
assertEqual(itemPorModelo.marcaRepuesto, 'EBITEN-BECO', 'normalizeItem still preserves the parts brand separately');

// Multi-word model names ("GRAND VITARA") must match too, not just single words.
const itemModeloDosPalabras = App.dictionaries.normalizeItem({ proveedor: 'TAHIO', marca: 'TSA', repuesto: 'DAMPER CIG SUZ GRAND VITARA 2.0 J20A', precio: 10 });
assertEqual(itemModeloDosPalabras.marca, 'SUZUKI', 'normalizeItem matches two-word model names like GRAND VITARA (also SUZ brand word already covers this case, but confirms the fallback works standalone)');

// When nothing at all is found, marca stays blank instead of duplicating marcaRepuesto.
const itemSinMarca = App.dictionaries.normalizeItem({ proveedor: 'EBITEN', marca: 'CIC-USA', repuesto: 'TENSOR CADENA CAVALIER M2.2', precio: 10 });
assertEqual(itemSinMarca.marca, 'CHEVROLET', 'normalizeItem finds CAVALIER as a Chevrolet model');
const itemRealmenteSinMarca = App.dictionaries.normalizeItem({ proveedor: 'EBITEN', marca: 'CIC-USA', repuesto: 'PIEZA GENERICA SIN MODELO CONOCIDO', precio: 10 });
assertEqual(itemRealmenteSinMarca.marca, '', 'normalizeItem leaves marca blank (not duplicating marcaRepuesto) when nothing is recognized');
renderAssertions();
</script>
<script>
const p1 = App.providers.upsert({
  nombre: 'ACME', descuentoEfectivoPercent: 40, descuentoProntoPagoPercent: 15,
  diasProntoPago: 30, descuentosAcumulables: true, montoMinimo: 300, tasaTipo: 'BCV_USD',

assertEqual(App.providers.getAll().length, 1, 'providers.upsert updates instead of duplicating');
assertEqual(App.providers.getById(p1.id).nombre, 'ACME RENAMED', 'providers.upsert applies the update');
App.providers.remove(p1.id);
assertEqual(App.providers.getAll().length, 0, 'providers.remove deletes provider');
renderAssertions();
</script>

<script>
const provider = {
  descuentoEfectivoPercent: 40, descuentoProntoPagoPercent: 15,
  descuentosAcumulables: true, montoMinimo: 300, tasaTipo: 'BCV_USD',
};
const rates = { BCV_USD: 40 };

const r1 = App.calculator.calculateFinalPrice(1000, provider, rates, { aplicarEfectivo: false, aplicarProntoPago: false });
assertEqual(r1.precioFinalUSD, 1000, 'calculator: no discounts leaves price unchanged');
assertEqual(r1.cumpleMinimo, true, 'calculator: 1000 >= minimo 300 cumple');
assertEqual(r1.descuentosAplicados, 'Ninguno', 'calculator: label is Ninguno with no discounts');

const r2 = App.calculator.calculateFinalPrice(1000, provider, rates, { aplicarEfectivo: true, aplicarProntoPago: false });
assertEqual(r2.precioFinalUSD, 600, 'calculator: 40% cash discount applied');

const r3 = App.calculator.calculateFinalPrice(1000, provider, rates, { aplicarEfectivo: true, aplicarProntoPago: true });
assertEqual(r3.precioFinalUSD, 510, 'calculator: cumulative 40% then 15% compounds to 510');
assertEqual(r3.tasaAplicada, 40, 'calculator: uses BCV_USD rate from provider.tasaTipo');
assertEqual(r3.precioFinalBs, 20400, 'calculator: precioFinalBs = precioFinalUSD * tasaAplicada');

const providerNoAcumula = { ...provider, descuentosAcumulables: false };
const r4 = App.calculator.calculateFinalPrice(1000, providerNoAcumula, rates, { aplicarEfectivo: true, aplicarProntoPago: true });
assertEqual(r4.precioFinalUSD, 600, 'calculator: non-cumulative discounts uses only the larger one');

const r5 = App.calculator.calculateFinalPrice(100, provider, rates, { aplicarEfectivo: false, aplicarProntoPago: false });
assertEqual(r5.cumpleMinimo, false, 'calculator: 100 < minimo 300 no cumple');
renderAssertions();
</script>
<script>
// Stub fetch to avoid a real network call in the test harness.
window.fetch = function (url) {
  return Promise.resolve({
    ok: true,
    json: () => Promise.resolve([
      { proveedor: 'ACME', filas: [{ marca: 'CHE', repuesto: 'PISTON', precio: 100 }] },
    ]),
  });
};

App.sync.setWebAppUrl('https://example.com/exec');
App.sync.syncNow().then(function (result) {
  assertEqual(result.ok, true, 'sync.syncNow resolves ok:true on successful fetch');
  assertEqual(result.itemCount, 1, 'sync.syncNow reports the flattened item count');
  const items = App.sync.getCachedItems();
  assertEqual(items.length, 1, 'sync.getCachedItems returns the stored items');
  assertEqual(items[0].marca, 'CHEVROLET', 'sync.getCachedItems items are normalized');
  assertEqual(items[0].proveedor, 'ACME', 'sync.getCachedItems keeps proveedor name');

  // Now simulate offline: fetch rejects, cache must survive untouched.
  window.fetch = function () { return Promise.reject(new Error('offline')); };
  App.sync.syncNow().then(function (offlineResult) {
    assertEqual(offlineResult.ok, false, 'sync.syncNow resolves ok:false when fetch fails');
    assertEqual(App.sync.getCachedItems().length, 1, 'sync.syncNow keeps old cache on failure');
    renderAssertions();
  });
});
</script>
<script>
const items = [
  { proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'PISTONES', precio: 1000 },
  { proveedor: 'ACME', marca: 'FORD', repuesto: 'AXIALES', precio: 200 },
  { proveedor: 'OTRO', marca: 'CHEVROLET', repuesto: 'PISTONES', precio: 50 },
];
const providersList = [
  { id: 'p1', nombre: 'ACME', descuentoEfectivoPercent: 40, descuentoProntoPagoPercent: 0, descuentosAcumulables: false, montoMinimo: 300, tasaTipo: 'BCV_USD' },
];
const ratesObj = { BCV_USD: 40 };

const { resultados: resultado, proveedoresSinTasa: sinTasa1 } = App.search.filterAndCalculate(items, providersList, ratesObj, {
  texto: 'piston', marca: '', aplicarEfectivo: true, aplicarProntoPago: false,
});
assertEqual(resultado.length, 1, 'search.filterAndCalculate: text filter matches PISTONES, excludes AXIALES, excludes unmatched provider OTRO');
assertEqual(resultado[0].precioFinalUSD, 600, 'search.filterAndCalculate applies calculator discount to filtered item');
assertEqual(sinTasa1, [], 'search.filterAndCalculate: no missing rates when tasaTipo is present');

// Plural search term must still find a singular word in the description
// (and vice versa) — real provider data spells this inconsistently.
const { resultados: resultadoPlural } = App.search.filterAndCalculate(
  [{ proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'CONCHA BANCADA TOYOTA 1FZ L6 4.5L', precio: 10 }],
  providersList, ratesObj, { texto: 'conchas', marca: '', aplicarEfectivo: false, aplicarProntoPago: false }
);
assertEqual(resultadoPlural.length, 1, 'search.filterAndCalculate: searching "conchas" (plural) finds a repuesto spelled "CONCHA" (singular)');

// Connector words in the search phrase ("de") must not be required to
// literally appear in the description — most descriptions never spell them.
const { resultados: resultadoConector } = App.search.filterAndCalculate(
  [{ proveedor: 'ACME', marca: 'FORD', repuesto: 'CONCHA BANCADA FORD F150', precio: 10 }],
  providersList, ratesObj, { texto: 'concha de bancada', marca: 'FORD', aplicarEfectivo: false, aplicarProntoPago: false }
);
assertEqual(resultadoConector.length, 1, 'search.filterAndCalculate: "concha de bancada" + marca FORD matches despite "de" not appearing in the description');

// Short connector words in the description ("CON") must NOT falsely match
// just because the search term happens to start with them.
const { resultados: resultadoFalsoPositivo } = App.search.filterAndCalculate(
  [{ proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'EMPACADURA TAPA VALVULA SILVERADO M5.3 CON CHUPONES', precio: 10 }],
  providersList, ratesObj, { texto: 'conchas', marca: '', aplicarEfectivo: false, aplicarProntoPago: false }
);
assertEqual(resultadoFalsoPositivo.length, 0, 'search.filterAndCalculate: "conchas" does not falsely match a description containing the short word "CON"');

const { resultados: resultadoMarca } = App.search.filterAndCalculate(items, providersList, ratesObj, {
  texto: '', marca: 'FORD', aplicarEfectivo: false, aplicarProntoPago: false,
});
assertEqual(resultadoMarca.length, 1, 'search.filterAndCalculate: marca filter matches only FORD item');

const { resultados: resultadoOrden } = App.search.filterAndCalculate(
  [
    { proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'PISTONES', precio: 1000 },
    { proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'PISTONES', precio: 100 },
  ],
  providersList, ratesObj, { texto: '', marca: '', aplicarEfectivo: false, aplicarProntoPago: false }
);
assertEqual(resultadoOrden[0].precioFinalUSD, 100, 'search.filterAndCalculate sorts ascending by precioFinalUSD');

// I4: missing exchange rate excludes the item and reports the affected provider.
const { resultados: resultadoSinTasa, proveedoresSinTasa: sinTasa2 } = App.search.filterAndCalculate(
  [{ proveedor: 'ACME', marca: 'CHEVROLET', repuesto: 'PISTONES', precio: 1000 }],
  providersList, { BCV_EUR: 43 }, { texto: '', marca: '', aplicarEfectivo: false, aplicarProntoPago: false }
);
assertEqual(resultadoSinTasa.length, 0, 'search.filterAndCalculate excludes items whose provider rate is missing');
assertEqual(sinTasa2, ['ACME'], 'search.filterAndCalculate reports the provider names with a missing rate');
renderAssertions();
</script>
